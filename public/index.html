<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0912">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dream Journal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/newsreader-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="dim" aria-hidden="true"></div>

  <!-- Capture: the whole screen is the button. -->
  <main id="capture" class="screen night" data-state="idle">
    <header class="bar">
      <span></span>
      <div class="bar-right">
        <button id="cancel" class="link" type="button" data-confirm="discard it?" hidden>cancel</button>
        <a href="#/journal" class="link" id="to-journal">Journal</a>
      </div>
    </header>

    <div id="stage" role="button" tabindex="0" aria-label="Tap to start or stop recording a dream">
      <div class="dot" aria-hidden="true"></div>
      <div id="idle-copy">
        <p class="ask">What did you dream?</p>
        <p class="hint">Tap anywhere and start talking.</p>
      </div>
      <p id="transcript"><span id="final"></span> <span id="interim"></span></p>
      <p id="draft-note" class="hint" hidden>unsaved — tap to keep going</p>
      <p id="banner" hidden></p>
      <p id="last-saved" class="hint" hidden></p>
    </div>

    <form id="typing" hidden>
      <textarea id="type-box" placeholder="What did you dream?" aria-label="Type your dream"></textarea>
      <div class="typing-foot">
        <span id="type-why" class="hint"></span>
        <span class="typing-actions">
          <button type="button" class="link" id="retry-voice" hidden>try voice again</button>
          <button type="submit" class="quiet">save</button>
        </span>
      </div>
    </form>
  </main>

  <section id="page" class="screen day" hidden></section>

  <div id="onboarding" class="screen night" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="live" class="sr" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
